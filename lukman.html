<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { background:var(--darker); color:var(--cream); font-family:'Montserrat',sans-serif; }

/* WhatsApp FLOAT */
.whatsapp-float {
  position: fixed;
  width: 60px;
  height: 60px;
  bottom: 25px;
  right: 25px;
  background: #25D366;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  text-decoration: none;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  z-index: 9999;
}

/* Contact links */
.contact-value a {
  color: inherit;
  text-decoration: none;
}

.contact-value a:hover {
  color: var(--gold);
}
